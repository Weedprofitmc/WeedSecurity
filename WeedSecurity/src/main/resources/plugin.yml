name: WeedSecurity
version: 1.4.1
main: dev.weedsecurity.WeedSecurity
api-version: '1.21'
author: Weed
description: PIN authentication, operator allowlist, administration panels and audit history
depend: [WeedCore, WeedLib]
softdepend: [LuckPerms, PlaceholderAPI, Vault]
commands:
  weedsecurity:
    description: WeedSecurity administration
    usage: /weedsecurity <panel|playerlist|repass|giveop|permission|info>
    aliases: [ws]
  pincode:
    description: WeedSecurity PIN authentication
    usage: /pincode set <PIN> | /pincode <PIN>

permissions:
  weedsecurity.admin:
    default: op
  weedsecurity.pin.bypass:
    default: op
